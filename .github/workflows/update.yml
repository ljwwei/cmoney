name: Update TW stock data

on:
  schedule:
    # GitHub cron 使用 UTC；台北時間 = UTC+8。只在週一至週五、台北 13:40–23:59 之間每 5 分鐘觸發。
    # 實際「該不該抓」由 scripts/fetch.mjs 依交易日與各項目的開始時間判斷，非交易日會直接結束。
    - cron: '40-59/5 5 * * 1-5'   # 台北 13:40–13:59
    - cron: '*/5 6-15 * * 1-5'    # 台北 14:00–23:55
    # 台北 08:30：更新證交所休市日行事曆（颱風等臨時休市通常早上公告）
    - cron: '30 0 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '補抓指定日期（YYYY-MM-DD，留空＝依目前時間正常執行）'
        required: false
        default: ''

permissions:
  contents: write

# 同一時間只跑一個，避免互相 push 衝突
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and commit
        env:
          BACKFILL_DATE: ${{ github.event.inputs.date }}
        run: |
          git config user.name "cmoney-bot"
          git config user.email "cmoney-bot@users.noreply.github.com"

          commit_and_push() {
            git add data/data.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update data $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
              for i in 1 2 3; do
                git pull --rebase && git push && break
                sleep $((i * 3))
              done
            fi
          }

          if [ -n "$BACKFILL_DATE" ]; then
            node scripts/fetch.mjs --date="$BACKFILL_DATE" || true
            commit_and_push
            exit 0
          fi

          # 融資餘額 20:35 後需每 2 分鐘抓一次：一次 cron 內最多跑 3 輪（0、2、4 分鐘）
          for round in 1 2 3; do
            code=0
            node scripts/fetch.mjs || code=$?
            commit_and_push
            [ "$code" -eq 10 ] || break   # 結束碼 10 = 融資餘額尚未取得，2 分鐘後再試
            [ "$round" -lt 3 ] && sleep 120
          done
          exit 0

