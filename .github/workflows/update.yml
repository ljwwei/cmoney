name: Update TW stock data

# 為什麼不是「每 5 分鐘一個 cron 各跑一次」？
# GitHub 的排程 cron 是「盡力而為」：免費帳號在尖峰時會大量延遲甚至整批跳過，
# 實測 13:40–14:49 之間一次都沒有觸發，導致資料晚了一個多小時才更新。
# 所以改成「常駐輪詢」：cron 只負責把輪詢工作「叫起來」（多個時間點互相備援），
# 一旦起來，就在同一個 job 內每 30 秒抓一次，直到今天的項目都抓齊為止。
# 單一 job 上限 6 小時，所以接近上限時會用 workflow_dispatch 自己接力。

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update.yml'
  schedule:
    # GitHub cron 使用 UTC；台北時間 = UTC+8。
    # 主力排程已由 Cloudflare Workers Cron 精準喚醒（平日 13:25–21:25 每小時 25 分）。
    # 此處保留 GitHub 內建排程作為離線備援（Fallback），避免歷史紀錄被頻繁洗版：
    # 1. 台北 08:30：更新證交所休市日行事曆（颱風等臨時休市通常早上公告），只跑一輪
    - cron: '30 0 * * 1-5'
    # 2. 台北 13:30、14:30、20:30：三大關鍵時段備援喚醒（大盤、法人/期貨、含鉅額/融資）
    - cron: '30 5,6,12 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '補抓指定日期（YYYY-MM-DD，留空＝依目前時間正常執行）'
        required: false
        default: ''

permissions:
  contents: write
  actions: write # 接力：以 workflow_dispatch 啟動下一個輪詢 job

# 同一時間只跑一個（避免互相 push 衝突）；排隊中的只保留最新一個，不會取消正在輪詢的
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and commit
        env:
          BACKFILL_DATE: ${{ github.event.inputs.date }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "cmoney-bot"
          git config user.email "cmoney-bot@users.noreply.github.com"

          commit_and_push() {
            git add data/data.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update data $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
              for i in 1 2 3; do
                if git pull --rebase --autostash && git push; then
                  return 0
                fi
                git rebase --abort 2>/dev/null || true
                sleep $((i * 3))
              done
              echo "::warning::push 失敗，下一輪會再試"
            fi
          }

          # 手動補抓指定日期
          if [ -n "$BACKFILL_DATE" ]; then
            node scripts/fetch.mjs --date="$BACKFILL_DATE" || true
            commit_and_push
            exit 0
          fi

          # 台北時間 13:00 之前（例如凌晨排程延遲、08:30 行事曆檢查、上午誤觸發）：
          # 只做單次檢查（更新休市日行事曆），絕不進入常駐輪詢迴圈，避免非盤後時段空轉
          HOUR=$(TZ=Asia/Taipei date +%H)
          if [ "$HOUR" -lt 13 ]; then
            node scripts/fetch.mjs || true
            commit_and_push
            echo "目前為台北時間 $HOUR 時，尚未到盤後時段（13:00 前），單次檢查後直接退出。"
            exit 0
          fi

          # 常駐輪詢：每 30 秒一輪。
          #   fetch.mjs 結束碼 0  = 今天沒事了（非交易日／全部抓齊／已過 23:55）→ 結束
          #   fetch.mjs 結束碼 10 = 今天還有項目沒抓齊 → 30 秒後再跑
          DEADLINE=$((SECONDS + 5 * 3600 + 30 * 60))
          errors=0
          while true; do
            code=0
            node scripts/fetch.mjs || code=$?
            commit_and_push

            if [ "$code" -eq 0 ]; then
              echo "今天的項目都處理完了，結束輪詢。"
              exit 0
            elif [ "$code" -eq 10 ]; then
              errors=0
            else
              errors=$((errors + 1))
              if [ "$errors" -ge 10 ]; then
                echo "::error::fetch.mjs 連續 10 次異常結束（code=$code）"
                exit 1
              fi
            fi

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "接近單一 job 上限，啟動下一個輪詢 job 接力。"
              gh workflow run update.yml --ref "$GITHUB_REF_NAME" || true
              exit 0
            fi
            sleep 30
          done
