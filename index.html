<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="台股即時" />
  <title>台股資訊 | 加權指數・三大法人・外資期貨・融資餘額</title>
  <meta name="description" content="台股大盤盤中即時指數與每日盤後資訊：富果即時 WebSocket 大盤（含開盤/最高/最低）、三大法人買賣超、外資台股期貨空單、融資餘額。" />
  <!-- Cloudflare Worker 網址（富果 WS 單例、D1/SQLite 人數計次、中央氣象署/環境部氣象空品代理；金鑰皆存於 Worker Secrets） -->
  <meta name="taiex-api" content="https://cmoney-taiex.gamerwillywilly.workers.dev" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M10 44 24 28l9 9 21-21' fill='none' stroke='%23ff5a5f' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner pixel-shift">
      <h1 class="brand"><span class="brand__logo" aria-hidden="true">📈</span>台股資訊</h1>
      <div class="env-info" aria-label="臺南市即時氣溫與臺南測站空氣品質">
        <svg class="env-info__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span class="env-info__temp">臺南市 <span data-live-temp>--</span>°C <span class="weather-time" data-live-temp-time></span></span>
        <span class="weather-badge" data-live-aqi>空氣品質 載入中</span>
      </div>
      <div class="clock" aria-live="off">
        <span class="clock__label">台北時間</span>
        <span class="clock__time" id="clock">--:--:--</span>
      </div>
    </div>
  </header>

  <div class="pixel-shift-main pixel-shift">
  <main class="grid" id="app">
    <section class="card card--index" id="card-index" aria-labelledby="t-index">
      <header class="card__head"><h2 id="t-index">加權指數（大盤）</h2><span class="badge-slot"></span></header>
      <div class="card__body"><p class="empty">載入中…</p></div>
      <div class="notice" hidden></div>
      <footer class="card__foot"></footer>
    </section>

    <section class="card card--inst" id="card-inst" aria-labelledby="t-inst">
      <header class="card__head"><h2 id="t-inst">三大法人買賣超</h2><span class="badge-slot"></span></header>
      <div class="card__body"><p class="empty">載入中…</p></div>
      <div class="notice" hidden></div>
      <footer class="card__foot"></footer>
    </section>

    <section class="card card--fut" id="card-fut" aria-labelledby="t-fut">
      <header class="card__head"><h2 id="t-fut">外資台股期貨空單</h2><span class="badge-slot"></span></header>
      <div class="card__body"><p class="empty">載入中…</p></div>
      <div class="notice" hidden></div>
      <footer class="card__foot"></footer>
    </section>

    <section class="card card--margin" id="card-margin" aria-labelledby="t-margin">
      <header class="card__head"><h2 id="t-margin">融資餘額</h2><span class="badge-slot"></span></header>
      <div class="card__body"><p class="empty">載入中…</p></div>
      <div class="notice" hidden></div>
      <footer class="card__foot"></footer>
    </section>
  </main>

  <footer class="site-foot">
    <p class="legend"><span class="up">■ 紅：上漲／買超／淨多／融資增加</span><span class="down">■ 綠：下跌／賣超／淨空／融資減少</span></p>
    <p>資料來源：臺灣證券交易所、臺灣期貨交易所。資料僅供參考，不構成任何投資建議。</p>
    <p id="meta-updated">資料更新：—</p>
    <p class="visit-counter">累積瀏覽總人次：<strong id="siteVisitCount">0</strong> 人</p>
  </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
