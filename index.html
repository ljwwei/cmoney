<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>台股資訊 | 加權指數・三大法人・外資期貨・融資餘額</title>
  <meta name="description" content="每日台股盤後資訊：加權指數、三大法人買賣超、外資台股期貨未平倉、融資餘額。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M10 44 24 28l9 9 21-21' fill='none' stroke='%23ff5a5f' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <h1 class="brand"><span class="brand__logo" aria-hidden="true">📈</span>台股資訊</h1>
      <div class="clock" aria-live="off">
        <span class="clock__label">台北時間</span>
        <span class="clock__time" id="clock">--:--:--</span>
      </div>
    </div>
  </header>

  <main class="grid" id="app">
    <section class="card card--index" id="card-index" aria-labelledby="t-index">
      <header class="card__head"><h2 id="t-index">加權指數（大盤）</h2><span class="badge-slot"></span></header>
      <div class="card__body"><p class="empty">載入中…</p></div>
      <div class="notice" hidden></div>
      <footer class="card__foot"></footer>
    </section>

    <section class="card card--inst" id="card-inst" aria-labelledby="t-inst">
      <header class="card__head"><h2 id="t-inst">三大法人買賣超</h2><span class="badge-slot"></span></header>
      <div class="card__body"><p class="empty">載入中…</p></div>
      <div class="notice" hidden></div>
      <footer class="card__foot"></footer>
    </section>

    <section class="card card--fut" id="card-fut" aria-labelledby="t-fut">
      <header class="card__head"><h2 id="t-fut">外資台股期貨未平倉</h2><span class="badge-slot"></span></header>
      <div class="card__body"><p class="empty">載入中…</p></div>
      <div class="notice" hidden></div>
      <footer class="card__foot"></footer>
    </section>

    <section class="card card--margin" id="card-margin" aria-labelledby="t-margin">
      <header class="card__head"><h2 id="t-margin">融資餘額</h2><span class="badge-slot"></span></header>
      <div class="card__body"><p class="empty">載入中…</p></div>
      <div class="notice" hidden></div>
      <footer class="card__foot"></footer>
    </section>
  </main>

  <footer class="site-foot">
    <p class="legend"><span class="up">■ 紅：上漲／買超／淨多／融資增加</span><span class="down">■ 綠：下跌／賣超／淨空／融資減少</span></p>
    <p>資料來源：臺灣證券交易所、臺灣期貨交易所。資料僅供參考，不構成任何投資建議。</p>
    <p id="meta-updated">資料更新：—</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
